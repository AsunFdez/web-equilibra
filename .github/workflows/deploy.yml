

name: Equilibra CI/CD

# Ejecutar al subir cambios a main, crear Pull Requests
# o iniciar manualmente el workflow
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Evitar ejecuciones simultáneas innecesarias
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # 1. EJECUTAR TESTS
  # ==========================================
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    steps:
      # Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Ejecutar los tests
      - name: Run tests
        run: node --test test/web.test.js


  # ==========================================
  # 2. PUBLICAR EN GITHUB PAGES
  # ==========================================
  deploy:
    name: Deploy to GitHub Pages

    # Este trabajo depende de que los tests terminen correctamente
    needs: test

    # No publicar desde Pull Requests ni desde otras ramas
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # Permisos necesarios para GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Preparar los archivos de la web
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Publicar la web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
