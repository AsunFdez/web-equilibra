
name: Deploy Equilibra

# Ejecutar cuando se actualice la rama main
on:
  push:
    branches:
      - main

  # Permite ejecutar el workflow manualmente
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evitar despliegues simultáneos
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Preparar los archivos de la web
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Publicar la web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
